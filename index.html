<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TODO AQuÍ</title>
<link rel="stylesheet" href="style.css">
</head>

<body>
<h1>TODO AQuÍ</h1>
<div id="stage" aria-label="Esfera de imágenes"></div>
<div id="hint">LIMA, PERÚ. 2026 © </div>
<div id="lb" role="dialog" aria-modal="true"><button id="x" aria-label="Cerrar">×</button><div id="box"></div><div id="cap"></div></div>

<script>
/* ===== TUS ARCHIVOS =====
   Agrega una línea por archivo. Si la lista está vacía se usan imágenes de prueba.
   type: 'image' | 'video' | 'audio' */
const MEDIA = [
   {type:'image', src:'media/assets/WEBP/eva02.webp'},
  {type:'image', src:'media/assets/WEBP/1IMG.webp'},
  {type:'image', src:'media/assets/WEBP/2IMG.webp'},
  {type:'image', src:'media/assets/WEBP/3IMG.webp'},
  {type:'image', src:'media/assets/WEBP/5IMG.webp'},
  {type:'image', src:'media/assets/WEBP/7IMG.webp'},
  {type:'image', src:'media/assets/WEBP/8IMG.webp'},
  {type:'image', src:'media/assets/WEBP/9IMG.webp'},
  {type:'image', src:'media/assets/WEBP/10IMG.webp'},
  {type:'image', src:'media/assets/WEBP/11IMG.webp'},
  {type:'image', src:'media/assets/WEBP/12IMG.webp'},
  {type:'image', src:'media/assets/WEBP/13IMG.webp'},
  {type:'image', src:'media/assets/WEBP/14IMG.webp'},
  {type:'image', src:'media/assets/WEBP/15IMG.webp'},
  {type:'image', src:'media/assets/WEBP/16IMG.webp'},
  {type:'image', src:'media/assets/WEBP/17IMG.webp'},
  {type:'image', src:'media/assets/WEBP/18IMG.webp'},
  {type:'image', src:'media/assets/WEBP/abyss.webp'},
  {type:'image', src:'media/assets/WEBP/arboles.webp'},
  {type:'image', src:'media/assets/WEBP/arete.png'}
  // {type:'video', src:'media/clip.mp4',  title:'Un clip'},
  // {type:'audio', src:'media/tema.mp3',  title:'Una canción'},
];

const stage=document.getElementById('stage'), lb=document.getElementById('lb'),
      box=document.getElementById('box'), cap=document.getElementById('cap');
let items=[], rx=-0.25, ry=0, vx=0, vy=0, W=0, H=0;

/* ===== AJUSTES DE CAOS =====
   SEED: cambia el número para otro acomodo (el mismo número = el mismo acomodo)
   JITTER: desorden en la posición (0 = esfera perfecta)
   DEPTH: cuánto se alejan unas fotos del borde de la esfera (0 = todas en la superficie)
   TILT: inclinación máxima de cada foto, en grados (total, ±mitad) */
const SEED=1, JITTER=0.1, DEPTH=0.15, TILT=0;
let _s=SEED;
function rand(){_s|=0;_s=_s+0x6D2B79F5|0;let t=Math.imul(_s^_s>>>15,1|_s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

function placeholder(i){
  const h=(i*47)%360, hh=300+(i*53)%140;
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="100" height="${hh}"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl(${h},70%,55%)"/><stop offset="1" stop-color="hsl(${(h+70)%360},75%,28%)"/></linearGradient></defs><rect width="300" height="${hh}" fill="url(#g)"/><circle cx="${80+(i*37)%150}" cy="${hh/2}" r="${40+(i*13)%50}" fill="hsla(${(h+180)%360},80%,75%,.55)"/><text x="16" y="${hh-16}" font-family="Arial" font-size="26" fill="#fff">${i+1}</text></svg>`;
  return 'data:image/svg+xml;utf8,'+encodeURIComponent(svg);
}

function build(){
  stage.innerHTML='';
  const list=MEDIA.length?MEDIA:Array.from({length:48},(_,i)=>({type:'image',src:placeholder(i),title:'Imagen de prueba '+(i+1)}));
  _s=SEED; const n=list.length, g=Math.PI*(3-Math.sqrt(5));
  items=list.map((m,i)=>{
    const y0=n>1?1-(i/(n-1))*2:0, y=Math.max(-1,Math.min(1,y0+(rand()-.5)*JITTER)), r=Math.sqrt(1-y*y), th=g*i+(rand()-.5)*JITTER*4, k=1-DEPTH+rand()*DEPTH*2;
    const el=document.createElement('div'); el.className='it';
    const w=Math.round(54+rand()*rand()*90); el.style.width=w+'px';
    if(m.type==='video'){
      const v=document.createElement('video'); v.src=m.src; v.muted=true; v.loop=true; v.playsInline=true; v.preload='metadata';
      el.onmouseenter=()=>v.play().catch(()=>{}); el.onmouseleave=()=>v.pause(); el.appendChild(v);
    }else if(m.type==='audio'){
      el.classList.add('aud'); el.style.background='hsl('+((i*61)%360)+',55%,30%)';
      el.innerHTML='<div><svg viewBox="0 0 24 24" fill="#f2f2ee"><path d="M9 3v11.6A3.5 3.5 0 1 0 11 18V8h6V3z"/></svg>'+esc(m.title||'')+'</div>';
    }else{
      const im=document.createElement('img'); im.src=m.src; im.alt=m.title||''; im.loading='lazy'; im.draggable=false; el.appendChild(im);
    }
    el.addEventListener('click',()=>{ if(!moved) openItem(m); });
    stage.appendChild(el);
    return {el,x:Math.cos(th)*r*k,y:y*k,z:Math.sin(th)*r*k,rot:(rand()-.5)*TILT};
  });
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function resize(){W=stage.clientWidth;H=stage.clientHeight}
function frame(){
  const R=Math.min(W,H)*0.42, P=R*3.2, cx=W/2, cy=H/2;
  const cY=Math.cos(ry), sY=Math.sin(ry), cX=Math.cos(rx), sX=Math.sin(rx);
  for(const it of items){
    const x1=it.x*cY+it.z*sY, z1=-it.x*sY+it.z*cY;
    const y2=it.y*cX-z1*sX, z2=it.y*sX+z1*cX;
    const pz=z2*R, s=P/(P-pz), d=Math.max(0,Math.min(1,(z2+1)/2));
    it.el.style.transform='translate('+(cx+x1*R*s).toFixed(1)+'px,'+(cy+y2*R*s).toFixed(1)+'px) translate(-50%,-50%) scale('+s.toFixed(3)+') rotate('+it.rot.toFixed(1)+'deg)';
    it.el.style.zIndex=Math.round(d*1000);
    it.el.style.opacity=(0.4+0.6*d).toFixed(2);
  }
  ry+=vy+(reduce||dragging?0:0.0015); rx=Math.max(-1.4,Math.min(1.4,rx+vx));
  vx*=0.93; vy*=0.93;
  requestAnimationFrame(frame);
}

/* interacción */
let dragging=false, moved=false, lx=0, ly=0, sx=0, sy=0;
stage.addEventListener('pointerdown',e=>{dragging=true;moved=false;lx=sx=e.clientX;ly=sy=e.clientY;stage.classList.add('drag')});
addEventListener('pointermove',e=>{
  if(!dragging)return;
  if(Math.hypot(e.clientX-sx,e.clientY-sy)>6)moved=true;
  vy=(e.clientX-lx)*0.0035; vx=-(e.clientY-ly)*0.0035; lx=e.clientX; ly=e.clientY;
});
addEventListener('pointerup',()=>{dragging=false;stage.classList.remove('drag');setTimeout(()=>moved=false,0)});
stage.addEventListener('wheel',e=>{e.preventDefault();vy+=e.deltaX*0.0004+e.deltaY*0.0004;vx+=0}, {passive:false});

/* ampliar */
function openItem(m){
  box.innerHTML='';
  let el;
  if(m.type==='video'){el=document.createElement('video');el.controls=true;el.autoplay=true;el.playsInline=true;el.src=m.src}
  else if(m.type==='audio'){el=document.createElement('audio');el.controls=true;el.autoplay=true;el.src=m.src}
  else{el=document.createElement('img');el.src=m.src;el.alt=m.title||''}
  el.addEventListener('click',e=>e.stopPropagation());
  box.appendChild(el); cap.textContent=m.title||''; lb.classList.add('on');
}
function closeLb(){lb.classList.remove('on');box.innerHTML=''}
lb.addEventListener('click',closeLb);
addEventListener('keydown',e=>{if(e.key==='Escape')closeLb()});

/* soltar archivos locales (solo duran mientras la página está abierta) */
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{
  e.preventDefault();
  const add=[...e.dataTransfer.files].map(f=>{
    const t=f.type.split('/')[0];
    return ['image','video','audio'].includes(t)?{type:t,src:URL.createObjectURL(f),title:f.name}:null;
  }).filter(Boolean);
  if(!add.length)return;
  if(!MEDIA.length&&!MEDIA._dropped){MEDIA._dropped=true}
  MEDIA.push(...add); build();
});

addEventListener('resize',resize);
resize(); build(); frame();
</script>
</body>
</html>
